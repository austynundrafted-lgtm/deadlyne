[package]
name = "tauri-plugin-ipad-files"
version = "0.1.0"
authors = [ "Austyn McFadden" ]
description = "Files access on iPad for Deadlyne: folder and file pickers with security-scoped bookmarks, Quick Look and the share sheet"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-ipad-files"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
