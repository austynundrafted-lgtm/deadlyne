[package]
name = "deadlyne"
version = "0.3.0"
description = "Deadlyne — instant RAW culling and captioning for sports photographers"
authors = ["Austyn McFadden"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "deadlyne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
regex = "1"
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
percent-encoding = "2"
md-5 = "0.10"
dirs = "6"
trash = "5"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
suppaftp = { version = "12", features = ["rustls-ring", "deprecated"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image decoding is unbearably slow unoptimized, even while developing.
[profile.dev.package."*"]
opt-level = 3
