[package]
name = "deadlyne"
version = "0.3.6"
description = "Deadlyne — instant RAW culling and captioning for sports photographers"
authors = ["Austyn McFadden"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "deadlyne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["self-update", "desktop-notifications"]
self-update = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
desktop-notifications = ["dep:tauri-plugin-notification"]
mac-app-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
regex = "1"
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
percent-encoding = "2"
md-5 = "0.10"
dirs = "6"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
suppaftp = { version = "12", features = ["rustls-ring", "deprecated"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSArray", "NSString", "NSError", "NSFileManager", "NSPathUtilities"] }
objc2-app-kit = { version = "0.3", features = ["NSOpenPanel", "NSSavePanel", "NSWorkspace", "NSApplication", "NSWindow", "block2"] }
block2 = "0.6"
objc2-quick-look-ui = "0.3"
objc2-user-notifications = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-window-state = "2"
trash = "5"

# iPad: Move to Trash goes through Foundation (Files' Recently Deleted); Files access, Quick Look and
# sharing come from the local ipad-files plugin.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }
tauri-plugin-ipad-files = { path = "plugins/ipad-files" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image decoding is unbearably slow unoptimized, even while developing.
[profile.dev.package."*"]
opt-level = 3

# Tao 0.35.3 returns a freed UISceneConfiguration on iOS release launches.
# Pin the upstream ownership fix until Tauri uses a release that includes it.
# https://github.com/tauri-apps/tao/pull/1245
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "f2163508104413ef0609178dcebdd5803b496211" }
